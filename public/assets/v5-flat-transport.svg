<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <style>
      .o{fill:#f6a919;stroke:#263746;stroke-width:8;stroke-linejoin:round;stroke-linecap:round}.y{fill:#ffd34f;stroke:#263746;stroke-width:8;stroke-linejoin:round;stroke-linecap:round}.d{fill:#374956;stroke:#263746;stroke-width:8;stroke-linejoin:round;stroke-linecap:round}.m{fill:#83929a;stroke:#263746;stroke-width:8;stroke-linejoin:round;stroke-linecap:round}.b{fill:#78d7ee;stroke:#263746;stroke-width:8;stroke-linejoin:round;stroke-linecap:round}.w{fill:#e9f8fb;stroke:#263746;stroke-width:7;stroke-linejoin:round}.l{fill:none;stroke:#263746;stroke-width:10;stroke-linejoin:round;stroke-linecap:round}.h{fill:none;stroke:#ffd34f;stroke-width:5;stroke-linecap:round}.bolt{fill:#ecf2ef;stroke:#263746;stroke-width:5}
    </style>
  </defs>

  <!-- 1 hovercraft frame -->
