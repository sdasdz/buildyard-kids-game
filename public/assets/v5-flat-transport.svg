    <path class="o" d="M46 127h120q38 0 53 35v47q-18 30-53 30H46z"/>
    <path class="d" d="M44 142h29v82H44z"/>
    <circle class="m" cx="202" cy="183" r="29"/>
    <path class="d" d="M191 156q-35-64 8-116 27 58 15 116zM213 209q35 64-8 116-27-58-15-116z"/>
    <circle class="y" cx="202" cy="183" r="12"/>
